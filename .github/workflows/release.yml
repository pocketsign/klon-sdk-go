name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: リリースバージョン（先頭の v 無し, e.g. 1.2.0）
        type: string
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create and push tag
        # inputs.version はシェルに直接展開せず env 経由で渡す（インジェクション対策）。
        # semver 形式のみ許可する（bash 正規表現で全体一致＝複数行入力も弾く）。
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          tag="v$VERSION"
          git tag "$tag"
          git push origin "$tag"
