version: "2"
linters:
  enable:
    - depguard
    - errcheck
    - exhaustive
    - gosec
    - govet
    - makezero
    - nolintlint
    - revive
    - staticcheck
    - testifylint
    - usetesting
    - whitespace
  settings:
    exhaustive:
      explicit-exhaustive-switch: true
    revive:
      rules:
        - name: exported
        - name: package-comments
    depguard:
      rules:
        main:
          files:
            - $all
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead
  exclusions:
    generated: lax
    rules:
      - path: '(.+)_test\.go'
        linters:
          - unused
          - gosec
          - revive
      - linters:
          - gosec
        text: 'G120'
    presets:
      - std-error-handling
formatters:
  exclusions:
    generated: lax
issues:
  max-same-issues: 50
